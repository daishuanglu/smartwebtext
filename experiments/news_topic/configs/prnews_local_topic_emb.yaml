model_name: 'prnews_local_topic_emb'
logger_dir: 'lightning_logs'
skip_prep_data: True
train_data_path: "data_model/prnews_local_topic_emb_training.csv"
val_data_path: "data_model/prnews_local_topic_emb_validation.csv"
train_val_split_ratio: [0.98, 0.02]
text_col: "Text"
ref_col: "Company"
limit:

skip_training: True
clear_cache: True
bert_model_name: 'distilbert-base-uncased'
ref_emb_size: 128
en1_units: 128
en2_units: 256
num_topic: 32
batch_size: 32  # Fit to a single 16GB GPU
learning_rate: 0.001
momentum: 0.99
init_mult: 1.0
variance: 0.995
max_doc_length: 512
max_ref_length: 32

epochs: 50
resume_ckpt:
monitor: 'val_perp'

analytics_examples:
  fpath: 'evaluators/prnews/analytics.csv'
  text_col: 'example_sent:analytics'
  ref_col: "company"
  sep: ','

innovation_examples:
  fpath: 'evaluators/prnews/innovation.csv'
  text_col: 'example_sent:innovation'
  ref_col: "company"
  sep: ','

technology_examples:
  fpath: 'evaluators/prnews/technology.csv'
  text_col: 'example_sent:technology'
  ref_col: "company"
  sep: ','